{% extends "base.html" %}{% block title %}个人资料 · ResumeCraft{% endblock %}
{% block content %}<div class="page-heading compact"><div><p class="eyebrow">PROFILE</p><h1>个人资料</h1><p class="lede">只保存事实信息，生成时再决定哪些内容进入简历。</p></div></div><form class="panel form-grid" method="post"><label>姓名<input name="name" value="{{ profile.name }}"></label><label>手机<input name="phone" value="{{ profile.phone }}"></label><label>邮箱<input name="email" value="{{ profile.email }}"></label><label>所在城市<input name="city" value="{{ profile.city }}"></label><label>期望城市<input name="desired_city" value="{{ profile.desired_city }}"></label><label>当前身份<input name="status" value="{{ profile.status }}"></label><label>预计毕业<input name="graduation" value="{{ profile.graduation }}"></label><label>可到岗/实习安排<input name="availability" value="{{ profile.availability }}"></label><label class="full">个人简介<textarea name="bio">{{ profile.bio }}</textarea></label><div class="form-actions"><button class="button primary">保存资料</button></div></form>{% endblock %}
